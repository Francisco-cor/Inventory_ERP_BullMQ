name: inventory-erp-observability-secrets

# Apply after docker-compose.yml and docker-compose.observability.yml.
# Create the external secret before starting the observability stack.

secrets:
  grafana_admin_password:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_grafana_admin_password
    external: true

services:
  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: null
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
