global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "erp-prometheus"

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "svc-productos"
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-productos:3001"]
        labels: { service: "svc-productos" }

  - job_name: "svc-ordenes"
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-ordenes:3002"]
        labels: { service: "svc-ordenes" }

  - job_name: "svc-stock"
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-stock:3003"]
        labels: { service: "svc-stock" }

  - job_name: "svc-obs"
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-obs:3004"]
        labels: { service: "svc-obs" }

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"] # si se añade redis_exporter, opcional
