name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly load test

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run type-check --workspaces --if-present
      - run: npm run type-check
      - name: Type check dashboard
        run: npm --prefix dashboard ci && npm --prefix dashboard run type-check

  dashboard:
    name: Dashboard Tests (vitest + msw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - name: Install dashboard deps
        run: npm --prefix dashboard ci
      - name: Run dashboard unit tests
        run: npm --prefix dashboard test
      - name: Build dashboard
        run: npm --prefix dashboard run build

  unit:
    name: Unit Tests (vitest + coverage 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run unit tests and coverage (covered domain suites)
        run: |
          npm run test --workspace=@erp/svc-ordenes -- --coverage --coverage.reportsDirectory=coverage --passWithNoTests
          npm run test --workspace=@erp/svc-productos -- --coverage --coverage.reportsDirectory=coverage --passWithNoTests
          npm run test --workspace=@erp/svc-stock -- --coverage --coverage.reportsDirectory=coverage
          # svc-obs has no unit suite yet; keep it explicit and non-covered.
          npm run test --workspace=@erp/svc-obs
          npx vitest run tests/contract --run --passWithNoTests
      - name: Check coverage artifacts (80% domain suites)
        run: |
          echo "Checking coverage thresholds..."
          # Vitest already fails if thresholds <80 per each covered suite config.
          test -f services/svc-ordenes/coverage/lcov.info
          test -f services/svc-productos/coverage/lcov.info
          test -f services/svc-stock/coverage/lcov.info
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: false
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/vitest
          key: vitest-${{ hashFiles('package-lock.json') }}

  integration:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: Run integration tests
        run: |
          npm run test:integration --workspace=@erp/svc-ordenes -- --passWithNoTests
          npm run test:integration --workspace=@erp/svc-stock -- --passWithNoTests
          npm run test:integration --workspace=@erp/svc-productos -- --passWithNoTests
        env:
          CI: "true"
      - name: Docker info
        if: failure()
        run: docker ps -a; docker logs $(docker ps -q) || true

  contract:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run build:packages
      - run: npm --workspace=@erp/contract-tests test

  e2e:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ hashFiles('docker-compose.yml', 'services/*/Dockerfile') }}
          restore-keys: buildx-
      - name: Build and start services
        run: docker compose up --build -d
        env:
          ADMIN_API_KEY: ci-test-key-7f4a2e8c1d9b6a3f0e5c8b2d4a6f1e9c
      - name: Wait for nginx to be healthy
        run: |
          echo "Waiting for services to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost/health/productos > /dev/null 2>&1; then
              echo "Services ready after ${i}x5s"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done
          curl -f http://localhost/health/productos
          curl -f http://localhost/health/ordenes
          curl -f http://localhost/health/stock
          curl -f http://localhost/health/obs
          curl -f http://localhost/health
          curl -f http://localhost:3001/metrics | head -20
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          ERP_BASE_URL: http://localhost:80
          ERP_API_KEY: ci-test-key-7f4a2e8c1d9b6a3f0e5c8b2d4a6f1e9c
        run: npm run test:e2e
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --tail=100

  load:
    name: Load Test (k6) — nightly or manual
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[load]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up --build -d
        env:
          ADMIN_API_KEY: ci-test-key-7f4a2e8c1d9b6a3f0e5c8b2d4a6f1e9c
      - run: |
          for i in $(seq 1 30); do curl -sf http://localhost/health/productos && break; sleep 5; done
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 order-flow (50 VUs)
        run: k6 run tests/load/order-flow.js --env ERP_BASE_URL=http://localhost:80 --env ERP_API_KEY=ci-test-key-7f4a2e8c1d9b6a3f0e5c8b2d4a6f1e9c
      - name: Run k6 stock-contention (100 VUs)
        run: k6 run tests/load/stock-contention.js --env ERP_BASE_URL=http://localhost:80 --env ERP_API_KEY=ci-test-key-7f4a2e8c1d9b6a3f0e5c8b2d4a6f1e9c
