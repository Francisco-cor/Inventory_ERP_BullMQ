name: inventory-erp-secrets

# Production overlay. Create these names in the deployment's secret manager
# before starting Compose (Docker Swarm, Vault/External Secrets, or a managed
# Compose runner can materialize them as external Docker secrets).
#
# Example:
#   docker compose -f docker-compose.yml -f docker-compose.external-secrets.yml up -d

secrets:
  admin_api_key:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_admin_api_key
    external: true
  jwt_secret:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_jwt_secret
    external: true
  productos_db_password:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_productos_db_password
    external: true
  ordenes_db_password:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_ordenes_db_password
    external: true
  stock_db_password:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_stock_db_password
    external: true
  obs_db_password:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_obs_db_password
    external: true
  productos_database_url:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_productos_database_url
    external: true
  ordenes_database_url:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_ordenes_database_url
    external: true
  stock_database_url:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_stock_database_url
    external: true
  obs_database_url:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_obs_database_url
    external: true
  redis_password:
    name: ${ERP_SECRET_PREFIX:-inventory-erp}_redis_password
    external: true

services:
  postgres-productos:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/productos_db_password
    secrets: [productos_db_password]
  postgres-ordenes:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/ordenes_db_password
    secrets: [ordenes_db_password]
  postgres-stock:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/stock_db_password
    secrets: [stock_db_password]
  postgres-obs:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/obs_db_password
    secrets: [obs_db_password]

  redis:
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 256mb
        --maxmemory-policy allkeys-lru --requirepass "$$(cat /run/secrets/redis_password)"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep PONG']
    secrets: [redis_password]

  svc-productos:
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/secrets/productos_database_url
      ADMIN_API_KEY: null
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      JWT_SECRET: null
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [productos_database_url, admin_api_key, jwt_secret, redis_password]
  svc-ordenes:
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/secrets/ordenes_database_url
      ADMIN_API_KEY: null
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      JWT_SECRET: null
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [ordenes_database_url, admin_api_key, jwt_secret, redis_password]
  svc-stock:
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/secrets/stock_database_url
      ADMIN_API_KEY: null
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      JWT_SECRET: null
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [stock_database_url, admin_api_key, jwt_secret, redis_password]
  svc-obs:
    environment:
      DATABASE_URL: null
      DATABASE_URL_FILE: /run/secrets/obs_database_url
      ADMIN_API_KEY: null
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      JWT_SECRET: null
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [obs_database_url, admin_api_key, jwt_secret, redis_password]
